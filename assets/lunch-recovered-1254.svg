<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="desk2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6a5848"/><stop offset=".5" stop-color="#514338"/><stop offset="1" stop-color="#332b25"/></linearGradient>
    <linearGradient id="screen2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfeff0"/><stop offset="1" stop-color="#91bfc4"/></linearGradient>
    <linearGradient id="bottle2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7d2df" stop-opacity=".9"/><stop offset="1" stop-color="#537582" stop-opacity=".95"/></linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="grain2"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="11" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer></filter>
    <radialGradient id="vig2" cx="52%" cy="46%" r="72%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".62"/></radialGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#desk2)"/>
  <rect x="0" y="0" width="1200" height="145" fill="#24303a" opacity=".86"/>
  <!-- laptop: same position, screen content has scrolled to a different paragraph -->
  <rect x="90" y="110" width="590" height="330" rx="18" fill="#141b21" filter="url(#shadow2)"/>
  <rect x="114" y="133" width="542" height="278" rx="7" fill="url(#screen2)"/>
  <rect x="147" y="163" width="455" height="10" rx="3" fill="#4d747b" opacity=".55"/>
  <rect x="147" y="187" width="420" height="10" rx="3" fill="#4d747b" opacity=".55"/>
  <rect x="147" y="215" width="300" height="18" rx="4" fill="#365f68" opacity=".85"/>
  <rect x="147" y="255" width="444" height="10" rx="3" fill="#4d747b" opacity=".65"/>
  <rect x="147" y="279" width="410" height="10" rx="3" fill="#4d747b" opacity=".65"/>
  <rect x="147" y="303" width="365" height="10" rx="3" fill="#4d747b" opacity=".65"/>
  <rect x="147" y="341" width="180" height="14" rx="4" fill="#678e94" opacity=".55"/>
  <rect x="472" y="255" width="4" height="30" fill="#2a4a52" opacity=".75"/>
  <!-- keyboard base -->
  <path d="M66 441h640l115 122H22z" fill="#161d22" filter="url(#shadow2)"/>
  <g opacity=".55" fill="#2b373e"><rect x="102" y="470" width="490" height="9" rx="3"/><rect x="127" y="492" width="440" height="8" rx="3"/><rect x="156" y="515" width="390" height="8" rx="3"/></g>
  <!-- lunch container, still largely untouched -->
  <g filter="url(#shadow2)">
    <rect x="815" y="436" width="248" height="155" rx="22" fill="#c9a56e"/>
    <rect x="834" y="456" width="210" height="116" rx="17" fill="#dfc08d"/>
    <path d="M857 515c42-37 82-30 121 2-42 39-83 43-121-2z" fill="#aa744e" opacity=".75"/>
    <path d="M868 503c39-22 72-20 102 1" fill="none" stroke="#80965f" stroke-width="15" stroke-linecap="round"/>
  </g>
  <!-- drink bottle, same position -->
  <g filter="url(#shadow2)">
    <rect x="1037" y="256" width="75" height="229" rx="24" fill="url(#bottle2)"/>
    <rect x="1052" y="222" width="45" height="47" rx="10" fill="#21333c"/>
    <path d="M1056 296c19 17 34 20 51 11" fill="none" stroke="#e2f0f5" stroke-opacity=".34" stroke-width="7"/>
  </g>
