  <g transform="rotate(-17 906 244)" filter="url(#shadow2)"><rect x="835" y="192" width="146" height="82" rx="7" fill="#ead9a6"/><line x1="853" y1="217" x2="953" y2="217" stroke="#9a8662" stroke-width="5"/><line x1="853" y1="236" x2="934" y2="236" stroke="#9a8662" stroke-width="4"/></g>
  <!-- workbook, unchanged -->
  <g transform="rotate(8 748 640)"><rect x="688" y="620" width="165" height="16" rx="8" fill="#233d55"/><rect x="837" y="620" width="45" height="16" rx="8" fill="#d1b667"/></g>
  <rect width="1200" height="760" fill="url(#vig2)"/>
  <rect width="1200" height="760" filter="url(#grain2)" opacity=".35"/>
